name: Refresh live EPL data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest data
        run: python3 scripts/refresh.py .
      - name: Commit updated data
        run: |
          git config user.name "epl-bot"
          git config user.email "epl-bot@users.noreply.github.com"
          git add js/data.js
          git diff --staged --quiet || \
          git commit -m "data: auto-refresh standings/results/fixtures [skip ci]"
          git push
